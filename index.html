<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matt's trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ebf1; --card:#ffffff; --ink:#101b2e; --mute:#566276; --line:#d3dbe5; --chip:#eef2f7;
  --accent:#4b1a8c; --on-accent:#ffffff; --band:#f1ecfa;
  --warn:#b04700; --warn-soft:#fde9d8; --good:#0f7a57; --good-soft:#dcf3ea;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a111c; --card:#121b2a; --ink:#e9eef7; --mute:#93a3ba; --line:#223148; --chip:#1a2639;
    --accent:#b8a0ff; --on-accent:#140a26; --band:#1a1f38;
    --warn:#ffa65a; --warn-soft:#3a2513; --good:#55d6a6; --good-soft:#12352a;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111c; --card:#121b2a; --ink:#e9eef7; --mute:#93a3ba; --line:#223148; --chip:#1a2639;
  --accent:#b8a0ff; --on-accent:#140a26; --band:#1a1f38;
  --warn:#ffa65a; --warn-soft:#3a2513; --good:#55d6a6; --good-soft:#12352a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 36px}

.head{padding:20px 0 4px}
h1{font:700 36px/1 var(--cond);margin:0;letter-spacing:.005em}
.head p{margin:6px 0 0;color:var(--mute);font-size:15px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.mode{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{font:600 15px var(--sans);border:0;background:transparent;color:var(--mute);
  padding:7px 16px;border-radius:999px;min-height:38px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.all{font:600 15px var(--sans);color:var(--accent);background:transparent;border:0;padding:8px 4px;min-height:38px;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tot{display:grid;grid-template-columns:repeat(3,1fr);margin:4px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tot div{padding:10px 0}
.tot dt{font-size:13px;color:var(--mute)}
.tot dd{margin:0;font:700 26px/1.1 var(--cond)}
.tot dd small{display:block;font:400 13px var(--sans);color:var(--mute)}

.trip{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;overflow:hidden}
.trip>summary{list-style:none;cursor:pointer;padding:14px 14px 14px;display:grid;
  grid-template-columns:auto 1fr auto;column-gap:12px;align-items:center;-webkit-tap-highlight-color:transparent}
.trip>summary::-webkit-details-marker{display:none}
.date{text-align:center;line-height:1;min-width:48px;padding:7px 4px 8px;border-radius:10px;background:var(--accent);color:var(--on-accent)}
.date b{display:block;font:700 27px/1 var(--cond)}
.date span{font-size:13px;font-weight:500}
.name{font:700 23px/1.1 var(--cond);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st{font:600 12.5px var(--sans);padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--mute)}
.st.now{background:var(--accent);color:var(--on-accent)}
.st.next{border:1.5px solid var(--accent);color:var(--accent);background:transparent}
.sub{font-size:14.5px;color:var(--mute);margin-top:3px}
.chev{width:10px;height:10px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details[open]>summary .chev{transform:rotate(-135deg)}

.route{grid-column:1/-1;display:flex;align-items:flex-start;margin:16px 12px 0;padding-bottom:24px}
.node{position:relative;width:12px;height:12px;flex:none;border-radius:50%;background:var(--accent)}
.node.dh{background:var(--card);border:2.5px solid var(--accent)}
.node b{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:600 13.5px/1 var(--cond);letter-spacing:.02em;color:var(--ink)}
.lnk{flex:1;min-width:12px;height:3px;margin-top:4.5px;background:var(--accent)}
.lnk.dh{height:2px;margin-top:5px;background:repeating-linear-gradient(90deg,var(--mute) 0 5px,transparent 5px 9px)}

.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;margin:0;padding-top:12px;border-top:1px solid var(--line)}
.stats dt{font-size:13px;color:var(--mute)}
.stats dd{margin:1px 0 0;font:600 20px/1.15 var(--cond)}
.stats dd small{font:500 13px var(--sans);color:var(--mute)}
.stats dd em{display:block;font:500 13px/1.3 var(--sans);font-style:normal;color:var(--mute)}
s{color:var(--mute);font-weight:500;font-size:.8em;margin-left:5px}

.body{padding:4px 14px 16px;border-top:1px solid var(--line)}
.tl{position:relative;margin:16px 0 4px 6px;padding-left:16px;border-left:2px solid var(--line)}
.leg,.lay{position:relative;margin-bottom:16px}
.leg::before,.lay::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.lay::before{background:var(--card);border:3px solid var(--accent)}
.leg-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:8px}
.fn{font:700 19px/1 var(--cond)}
.tail{color:var(--mute);font-size:14px}
.tag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip)}
.tag.dh{border:1.5px dashed var(--mute);background:transparent;color:var(--mute)}
.times{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}
.pt .stn{font:600 15px/1 var(--cond);color:var(--mute);letter-spacing:.03em}
.pt .time{font:700 30px/1.05 var(--cond)}
.pt .time small{font:500 13px var(--sans);color:var(--mute);margin-left:4px}
.pt .gmt{font:600 16px/1.1 var(--cond);color:var(--mute);margin-top:1px}
.pt .gmt small{font:500 12px var(--sans);margin-left:3px}
.pt .day,.pt .sch{font-size:13.5px;color:var(--mute);margin-top:2px}
.pt.r{text-align:right}
.d{display:inline-block;font-weight:600;font-size:12.5px;padding:0 7px;border-radius:6px;margin-left:4px}
.d.late{background:var(--warn-soft);color:var(--warn)}
.d.early{background:var(--good-soft);color:var(--good)}
.mid{align-self:start;text-align:center;font:600 16px/1 var(--cond);min-width:52px;padding-top:21px}
.mid small{display:block;font:400 12px var(--sans);color:var(--mute);margin-top:2px}
.mid::after{content:"";display:block;height:2px;background:var(--line);margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta span{font-size:14px;background:var(--chip);border-radius:8px;padding:3px 9px}
.meta b{font-weight:600}

.lay-card{background:var(--band);border-radius:12px;padding:11px 12px}
.lay-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lay-h strong{font:700 19px/1.1 var(--cond)}
.lay-h .lo{font:700 19px/1.1 var(--cond)}
.hotel{margin:8px 0 2px;font-weight:600;font-size:16.5px}
.ph{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-weight:500;font-size:15px;min-height:36px}
.ph svg{flex:none}
.stamp{font-size:14.5px;color:var(--mute)}
.zsub{color:var(--mute)}
.g{font-size:14.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.gtimes{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin:5px 0 2px}
.gtime{font:700 30px/1.05 var(--cond)}
.gtime small{font:500 13px var(--sans);color:var(--mute);margin-left:3px}
.garrow{color:var(--mute);font-size:16px}
.gz{font-size:13px;color:var(--mute)}
.g .lbl{color:var(--mute)}
.g.x{color:var(--mute)}

.sec{margin-top:18px}
.sec h3{font:700 18px/1 var(--cond);margin:0 0 8px}
.rows{display:grid;gap:0}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.rows div:first-child{border-top:0}
.rows span:last-child{color:var(--mute);text-align:right}
.fo-edit{font:600 13px var(--sans);color:var(--accent);background:transparent;border:1px solid var(--accent);
  border-radius:7px;padding:2px 8px;margin-left:8px;cursor:pointer}
.crew-edit{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.crew-edit input{font:500 15px var(--sans);background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%;box-sizing:border-box} /* inside <details>, box-sizing does not inherit */
.crew-edit-actions{display:flex;gap:8px}
.crew-edit-actions button{flex:1;font:600 14px var(--sans);border-radius:8px;padding:8px;min-height:38px;cursor:pointer}
.fo-save{background:var(--accent);color:var(--on-accent);border:0}
.fo-cancel{background:transparent;color:var(--mute);border:1.5px solid var(--line)}

.foot{margin-top:20px;color:var(--mute);font-size:13.5px;line-height:1.45}

.rmwrap{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.cancel{font:600 14.5px var(--sans);color:var(--mute);background:transparent;border:1.5px solid var(--line);
  border-radius:9px;padding:8px 14px;min-height:38px;cursor:pointer}
.confirm-rm{font:600 14.5px var(--sans);color:#fff;background:var(--warn);border:0;border-radius:9px;
  padding:8px 14px;min-height:38px;cursor:pointer}
.rm{font:600 14.5px var(--sans);color:var(--mute);background:var(--chip);border:0;border-radius:9px;
  padding:8px 14px;min-height:38px;cursor:pointer}
.rm.confirm{background:var(--warn-soft);color:var(--warn)}

.hidden-sec{margin-top:18px}
.hidden-sec h2{font:700 20px/1 var(--cond);margin:0 0 8px}
.hidden-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hidden-row span{font:600 16px var(--cond)}
.hidden-row .btns{display:flex;gap:8px}
.restore{font:600 14.5px var(--sans);color:var(--accent);background:transparent;border:1.5px solid var(--accent);
  border-radius:9px;padding:6px 13px;min-height:36px;cursor:pointer}
.purge{font:600 14.5px var(--sans);color:var(--mute);background:transparent;border:1.5px solid var(--line);
  border-radius:9px;padding:6px 13px;min-height:36px;cursor:pointer}
.purge-confirm{font:600 14.5px var(--sans);color:#fff;background:var(--warn);border:0;
  border-radius:9px;padding:6px 13px;min-height:36px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

.pastewrap{margin:6px 0 4px}
.paste-btn{width:100%;font:600 15.5px var(--sans);color:var(--accent);background:var(--band);
  border:1.5px dashed var(--accent);border-radius:12px;padding:12px;min-height:44px;cursor:pointer}
.paste-form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.paste-form p{margin:0 0 10px;font-size:14px;color:var(--mute);line-height:1.45}
.paste-form textarea{width:100%;min-height:160px;font:400 13px/1.4 ui-monospace,monospace;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.paste-actions{display:flex;gap:8px;margin-top:12px}
.paste-actions button{flex:1;font:600 15px var(--sans);border-radius:10px;padding:11px;min-height:44px;cursor:pointer}
.paste-save{background:var(--accent);color:var(--on-accent);border:0}
.paste-cancel{background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.paste-form input{font:500 16px var(--sans);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.paste-err{color:var(--warn);font-size:14px;margin-top:8px}
.preview{border:2px solid var(--accent);border-radius:18px;margin-top:12px;overflow:hidden;background:var(--card)}
.preview-head{background:var(--band);padding:10px 14px;font:700 15px var(--sans);color:var(--accent)}
.preview-actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.preview-actions button{flex:1;font:600 15px var(--sans);border-radius:10px;padding:10px;min-height:42px;cursor:pointer}
.preview-add{background:var(--accent);color:var(--on-accent);border:0}
.preview-discard{background:transparent;color:var(--mute);border:1.5px solid var(--line)}


</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Matt's trips</h1>
    <p id="range"></p>
  </div>
  <form class="paste-form" id="lock" hidden>
    <p>Enter your trips password. Use the same password on each device.</p>
    <input type="text" name="username" value="MattTrips" autocomplete="username" hidden>
    <input type="password" id="pw" name="password" autocomplete="current-password" minlength="10" required aria-label="Password">
    <div class="paste-actions"><button class="paste-save">Unlock</button></div>
  </form>
  <div id="app" hidden>
  <div class="pastewrap">
    <button type="button" class="paste-btn" id="pasteBtn">+ Paste a trip recap</button>
    <div id="pasteForm"></div>
    <div id="pastePreview"></div>
  </div>
  <div class="bar">
    <button type="button" class="all" id="lockBtn" title="Forget the password and the trips on this device">Lock</button>
    <button type="button" class="all" id="all">Expand all</button>
  </div>
  <dl class="tot" id="tot"></dl>
  <main id="list"></main>
  <div id="hidden-sec"></div>
  <p class="foot" id="foot"></p>
  </div>
</div>

<script src="parse.js"></script>
<script src="trips.js"></script>
<script>
(function(){

var AP={
  MEM:{tz:'America/Chicago'}, ORD:{tz:'America/Chicago'}, DFW:{tz:'America/Chicago'},
  IAH:{tz:'America/Chicago'}, MSP:{tz:'America/Chicago'}, MDW:{tz:'America/Chicago'},
  EWR:{tz:'America/New_York'}, IND:{tz:'America/Indiana/Indianapolis'},
  ATL:{tz:'America/New_York'}, JFK:{tz:'America/New_York'}, LGA:{tz:'America/New_York'},
  BOS:{tz:'America/New_York'}, MCO:{tz:'America/New_York'}, MIA:{tz:'America/New_York'},
  DCA:{tz:'America/New_York'}, IAD:{tz:'America/New_York'}, CLT:{tz:'America/New_York'},
  PHL:{tz:'America/New_York'}, FLL:{tz:'America/New_York'}, TPA:{tz:'America/New_York'},
  DEN:{tz:'America/Denver'}, PHX:{tz:'America/Phoenix'}, SLC:{tz:'America/Denver'},
  OAK:{tz:'America/Los_Angeles'}, LAX:{tz:'America/Los_Angeles'}, SFO:{tz:'America/Los_Angeles'},
  SEA:{tz:'America/Los_Angeles'}, SAN:{tz:'America/Los_Angeles'}, LAS:{tz:'America/Los_Angeles'},
  PDX:{tz:'America/Los_Angeles'}, ANC:{tz:'America/Anchorage'}, HNL:{tz:'Pacific/Honolulu'},
  NRT:{tz:'Asia/Tokyo'}, KIX:{tz:'Asia/Tokyo'}, HND:{tz:'Asia/Tokyo'}, ICN:{tz:'Asia/Seoul'},
  CAN:{tz:'Asia/Shanghai'}, PVG:{tz:'Asia/Shanghai'}, HKG:{tz:'Asia/Hong_Kong'},
  BLR:{tz:'Asia/Kolkata'}, DEL:{tz:'Asia/Kolkata'}, BOM:{tz:'Asia/Kolkata'},
  CGN:{tz:'Europe/Berlin'}, FRA:{tz:'Europe/Berlin'}, MUC:{tz:'Europe/Berlin'},
  LHR:{tz:'Europe/London'}, CDG:{tz:'Europe/Paris'}, AMS:{tz:'Europe/Amsterdam'},
  DXB:{tz:'Asia/Dubai'}, SIN:{tz:'Asia/Singapore'}
};

var pendingRemoveId=null, pendingTimer=null, pendingPurgeId=null;

// ---------- sync: each device with the same password gets the newest record of each trip ----------
// A page served from this computer uses the local Worker (wrangler dev), so a preview never touches real data.
var SYNC_URL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://127.0.0.1:8787/s/':'https://matttrips-sync.matttrips-sync.workers.dev/s/';
var doc=Trips.emptyDoc();
try{ doc=JSON.parse(localStorage.getItem('matttrips:doc'))||doc; }catch(e){}
function syncKey(){ try{ return localStorage.getItem('matttrips:sync'); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem('matttrips:doc',JSON.stringify(doc)); }catch(e){} }
/** Apply one change to the doc with the current time, then save, show, and sync it. */
function change(fn){ fn(doc,Date.now()); save(); render(); syncSoon(); }
var syncTimer;
function syncSoon(){ clearTimeout(syncTimer); syncTimer=setTimeout(sync,1000); }
// ponytail: each sync sends the whole doc (about 3KB a trip, 1MB Worker cap = ~300 trips). Send only changed trips if it grows past that.
async function sync(){
  var k=syncKey(); if(!k) return;
  try{
    var res=await fetch(SYNC_URL+k,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)});
    if(!res.ok) throw new Error('sync '+res.status);
    doc=Trips.mergeDocs(doc,await res.json()); // keeps edits made while the request was out
    save(); render(); setSyncMark('');
  }catch(e){ setSyncMark('⚠'); } // no network: the next change, launch, or 'online' event tries again
}
function setSyncMark(m){ document.getElementById('lockBtn').textContent='Lock'+(m?' '+m:''); }
/** The sync key for a password: SHA-256, as base64url. The same password gives the same key on each device. */
async function syncKeyFor(password){
  var hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('matttrips-sync:'+password));
  return btoa(String.fromCharCode.apply(null,new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
document.getElementById('lock').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var pw=document.getElementById('pw');
  localStorage.setItem('matttrips:sync',await syncKeyFor(pw.value));
  pw.value='';
  render(); sync();
});
document.getElementById('lockBtn').addEventListener('click',function(){
  try{ localStorage.removeItem('matttrips:sync'); localStorage.removeItem('matttrips:doc'); }catch(e){}
  doc=Trips.emptyDoc(); render();
});
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') sync(); });
addEventListener('online',sync);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

var editingCrew=null; // { tripId, idx, name, id, phone } of the crew row being edited
var addDraft={};      // tripId -> { seat, name, id, phone } typed in the add-crew box
var cache={};
var PHONE='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';

function P(iso,tz,zLabel){
  if(!cache[tz]){cache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',hour:'2-digit',minute:'2-digit',weekday:'short',month:'short',day:'numeric',timeZoneName:'short'});}
  var o={};
  cache[tz].formatToParts(new Date(iso)).forEach(function(p){o[p.type]=p.value;});
  var h=o.hour==='24'?'00':o.hour;
  return {hm:h+':'+o.minute,wd:o.weekday,mon:o.month,d:o.day,day:o.weekday+' '+o.month+' '+o.day,key:o.month+o.day,tz:zLabel||o.timeZoneName};
}
function Ploc(iso,stn){return P(iso,(AP[stn]&&AP[stn].tz)||'UTC');}
function Pz(iso){return P(iso,'UTC','Z');}
function hm(s){return s.replace(/^0(\d)/,'$1');}
function diffMin(a,b){return Math.round((Date.parse(a)-Date.parse(b))/60000);}
function dur(n){var x=Math.abs(n);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');}
function pair(p){
  if(!p) return '';
  return (p[1]&&p[1]!==p[0])?'<b>'+hm(p[1])+'</b><s>'+hm(p[0])+'</s>':'<b>'+hm(p[0])+'</b>';
}
function tel(ph){return 'tel:'+ph.replace(/[^\d+]/g,'');}
function phone(ph){return '<a class="ph" href="'+tel(ph)+'">'+PHONE+ph+'</a>';}

function point(stn,act,sch,right){
  var a=Ploc(act,stn), z=Pz(act), s=Ploc(sch,stn), m=diffMin(act,sch), x='';
  if(m!==0){
    x='<div class="sch">Scheduled '+s.hm+(s.key!==a.key?' '+s.day:'')+
      '<span class="d '+(m>0?'late':'early')+'">'+(m>0?'+':'-')+dur(m)+'</span></div>';
  }
  return '<div class="pt'+(right?' r':'')+'"><div class="stn">'+stn+'</div>'+
    '<div class="time">'+a.hm+'<small>'+a.tz+'</small></div>'+
    '<div class="gmt">'+z.hm+'<small>Z</small></div>'+
    '<div class="day">'+a.day+'</div>'+x+'</div>';
}

function leg(f){
  var act=f.a||f.s;
  var head='<div class="leg-h"><span class="fn">'+f.no+'</span>'+
    (f.dh?'<span class="tag dh">Deadhead</span>':'')+
    (f.tail?'<span class="tail">'+f.tail+'</span>':'')+'</div>';
  var mid='<div class="mid">'+hm(f.blk[1]||f.blk[0])+'<small>block</small></div>';
  var meta='';
  if(f.duty) meta+='<span>Duty <b>'+hm(f.duty[1]||f.duty[0])+'</b></span>';
  if(f.turn) meta+='<span>Turn <b>'+hm(f.turn[1]||f.turn[0])+'</b></span>';
  if(f.meals) meta+='<span>Meals <b>'+f.meals+'</b></span>';
  return '<div class="leg">'+head+
    '<div class="times">'+point(f.o,act[0],f.s[0],false)+mid+point(f.d,act[1],f.s[1],true)+'</div>'+
    (meta?'<div class="meta">'+meta+'</div>':'')+'</div>';
}

function range(a,b,stn){
  var p=Ploc(a,stn), q=Ploc(b,stn), pz=Pz(a), qz=Pz(b);
  var loc=p.day+' '+p.hm+(p.key===q.key?' to '+q.hm:' to '+q.day+' '+q.hm)+' '+q.tz;
  var z=pz.hm+(pz.key===qz.key?' to '+qz.hm:' to '+qz.day+' '+qz.hm)+' Z';
  return loc+' <span class="zsub">('+z+')</span>';
}
function ground(label,g,stn,big){
  if(g.x){
    return '<div class="g x">'+label+': cancelled, no pickup arranged ('+range(g.a,g.b,stn)+')</div>';
  }
  if(big){
    var p=Ploc(g.a,stn), q=Ploc(g.b,stn), pz=Pz(g.a), qz=Pz(g.b);
    var times='<div class="gtimes">'+
      '<span class="gtime">'+hm(p.hm)+'<small>'+p.tz+'</small></span>'+
      '<span class="garrow">&#8594;</span>'+
      '<span class="gtime">'+hm(q.hm)+'<small>'+q.tz+'</small></span>'+
      '<span class="gz">('+hm(pz.hm)+' to '+hm(qz.hm)+' Z)</span></div>';
    return '<div class="g"><span class="lbl">'+label+':</span> '+g.co+times+phone(g.ph)+'</div>';
  }
  return '<div class="g"><span class="lbl">'+label+':</span> '+g.co+', '+range(g.a,g.b,stn)+'<br>'+phone(g.ph)+'</div>';
}
function layover(l,prev){
  var gin=l.gin||{x:true,a:l.in,b:l.in};
  var gout=l.gout||{x:true,a:l.out,b:l.out};
  return '<div class="lay"><div class="lay-card">'+
    '<div class="lay-h"><strong>Layover in '+l.stn+'</strong>'+(prev&&prev.lo?'<span class="lo">'+pair(prev.lo)+'</span>':'')+'</div>'+
    '<div class="hotel">'+l.hotel+'</div>'+
    '<div class="stamp">Hotel '+range(l.in,l.out,l.stn)+'</div>'+
    phone(l.ph)+
    ground('Ground in',gin,l.stn)+
    ground('Ground out',gout,l.stn,true)+
    '</div></div>';
}

function tripHTML(t,open,noRemove){
  var crewArr=Array.isArray(t.crew)?t.crew:[];
  var faresArr=Array.isArray(t.fares)?t.fares:[];
  var fl=t.items.filter(function(i){return i.t==='f';});
  var dhN=fl.filter(function(f){return f.dh;}).length;
  var nodes='<span class="node"><b>'+fl[0].o+'</b></span>';
  fl.forEach(function(f){
    nodes+='<span class="lnk'+(f.dh?' dh':'')+'"></span><span class="node'+(f.dh?' dh':'')+'"><b>'+f.d+'</b></span>';
  });
  var s=Ploc(t.show,t.base), e=Ploc(t.end,t.base), sz=Pz(t.show), ez=Pz(t.end), now=Date.now();
  var st=Date.parse(t.end)<now?['done','Completed']:(Date.parse(t.show)<=now?['now','In progress']:['next','Upcoming']);
  var stats=
    '<div><dt>Report</dt><dd>'+s.hm+' <small>'+s.tz+'</small><em>'+sz.hm+' Z</em></dd></div>'+
    '<div><dt>Release</dt><dd>'+e.hm+' <small>'+e.tz+'</small><em>'+ez.hm+' Z</em></dd></div>'+
    '<div><dt>Away</dt><dd>'+pair(t.away)+'</dd></div>'+
    '<div><dt>Block</dt><dd>'+pair(t.block)+'</dd></div>'+
    '<div><dt>Pay</dt><dd>'+pair(t.pay)+'</dd></div>'+
    '<div><dt>Legs</dt><dd>'+(fl.length-dhN)+(dhN?' <small>+ '+dhN+' deadhead</small>':'')+'</dd></div>';

  var tl='';
  t.items.forEach(function(it,i){
    tl+= it.t==='f' ? leg(it) : layover(it,t.items[i-1]);
  });

  // The paste preview (noRemove) is not in the doc yet, so it has no crew edits.
  var crew='<div class="sec"><h3>Crew</h3><div class="rows">'+crewArr.map(function(c,i){
    if(editingCrew && editingCrew.tripId===t.id && editingCrew.idx===i){
      return '<div class="crew-edit">'+
        '<input type="text" class="crew-name-input" value="'+escAttr(editingCrew.name)+'" placeholder="Name" aria-label="Name">'+
        '<input type="text" class="crew-id-input" value="'+escAttr(editingCrew.id)+'" placeholder="Employee number" aria-label="Employee number">'+
        '<input type="tel" class="crew-phone-input" value="'+escAttr(editingCrew.phone)+'" placeholder="Phone number" aria-label="Phone number">'+
        (c.added?'<small class="zsub">Clear all three to remove this crew member.</small>':'')+
        '<div class="crew-edit-actions">'+
          '<button type="button" class="fo-cancel" data-crew-cancel="1">Cancel</button>'+
          '<button type="button" class="fo-save" data-crew-save="'+t.id+'">Save</button>'+
        '</div></div>';
    }
    var isCap=(c.seat||'').toLowerCase()==='captain';
    return '<div><span>'+(c.name?escAttr(c.name)+' ('+escAttr((c.seat||'').toLowerCase())+(c.code?', '+escAttr(c.code):'')+')':escAttr(c.seat||''))+
      (noRemove||isCap?'':' <button type="button" class="fo-edit" data-crew-edit="'+t.id+'" data-crew-idx="'+i+'" data-crew-name="'+escAttr(c.name)+'" data-crew-id="'+escAttr(c.id)+'" data-crew-phone="'+escAttr(c.phone)+'">Edit</button>')+
      (c.phone?'<br>'+phone(escAttr(c.phone)):'')+
      '</span><span>'+escAttr(c.id)+'</span></div>';
  }).join('')+(noRemove?'':(function(){
    var dr=addDraft[t.id]||{};
    return '<div class="crew-edit crew-add" data-trip="'+t.id+'">'+
      '<input type="text" class="add-seat" value="'+escAttr(dr.seat)+'" placeholder="Role, for example Jumpseat" aria-label="Role">'+
      '<input type="text" class="add-name" value="'+escAttr(dr.name)+'" placeholder="Name" aria-label="Name">'+
      '<input type="text" class="add-id" value="'+escAttr(dr.id)+'" placeholder="Employee number" aria-label="Employee number">'+
      '<input type="tel" class="add-phone" value="'+escAttr(dr.phone)+'" placeholder="Phone number" aria-label="Phone number">'+
      '<div class="crew-edit-actions"><button type="button" class="fo-save" data-crew-add="'+t.id+'">Add crew member</button></div></div>';
  })())+'</div></div>';
  var fares=faresArr.length?'<div class="sec"><h3>Deadhead fares</h3><div class="rows">'+faresArr.map(function(f){
    return '<div><span>'+f.od+' on '+f.al+', class '+f.cls+'</span><span>$'+f.amt+'</span></div>';
  }).join('')+'</div></div>':'';

  return '<details class="trip" data-id="'+t.id+'"'+(open?' open':'')+'><summary>'+
    '<div class="date"><b>'+s.d+'</b><span>'+s.mon+'</span></div>'+
    '<div><div class="name">Trip '+t.id+'<span class="st '+st[0]+'">'+st[1]+'</span></div>'+
    '<div class="sub">'+s.day+' to '+e.day+'</div></div>'+
    '<span class="chev"></span>'+
    '<div class="route" aria-label="Route">'+nodes+'</div>'+
    '<dl class="stats">'+stats+'</dl></summary>'+
    '<div class="body"><div class="tl">'+tl+'</div>'+crew+fares+
    (noRemove?'':'<div class="rmwrap">'+(pendingRemoveId===t.id?
      '<button type="button" class="cancel" data-cancel-rm="'+t.id+'">Cancel</button>'+
      '<button type="button" class="confirm-rm" data-confirm-rm="'+t.id+'">Yes, remove trip</button>'
      :'<button type="button" class="rm" data-rm="'+t.id+'">Remove trip</button>')+'</div>')+
    '</div></details>';
}

function render(){
  var locked=!syncKey();
  document.getElementById('lock').hidden=!locked;
  document.getElementById('app').hidden=locked;
  if(locked){ document.getElementById('range').textContent=''; return; }
  var open={};
  document.querySelectorAll('#list details').forEach(function(d){open[d.dataset.id]=d.open;});
  var visible=Trips.visibleTrips(doc), hiddenTrips=Trips.hiddenTrips(doc), tot=Trips.totals(visible);

  if(!visible.length){
    document.getElementById('range').textContent='No trips on the schedule right now';
    document.getElementById('tot').innerHTML='';
    document.getElementById('list').innerHTML='';
  } else {
    var first=Ploc(visible[0].show,'MEM'), last=Ploc(visible[visible.length-1].end,'MEM');
    document.getElementById('range').textContent=first.mon+' '+first.d+' to '+last.mon+' '+last.d+', Memphis base';
    document.getElementById('tot').innerHTML=
      '<div><dt>Trips</dt><dd>'+tot.count+'</dd></div>'+
      '<div><dt>Block</dt><dd>'+tot.block[1]+'<small>planned '+tot.block[0]+'</small></dd></div>'+
      '<div><dt>Pay</dt><dd>'+tot.pay[1]+'<small>planned '+tot.pay[0]+'</small></dd></div>';
    document.getElementById('list').innerHTML=visible.map(function(t){return tripHTML(t,!!open[t.id]);}).join('');
  }

  document.getElementById('hidden-sec').innerHTML=hiddenTrips.length?
    '<div class="hidden-sec"><h2>Removed</h2>'+hiddenTrips.map(function(t){
      return '<div class="hidden-row"><span>Trip '+t.id+'</span><div class="btns">'+
        (pendingPurgeId===t.id?
          '<button type="button" class="purge" data-cancel-purge="'+t.id+'">Cancel</button>'+
          '<button type="button" class="purge-confirm" data-confirm-purge="'+t.id+'">Confirm delete</button>'
          :
          '<button type="button" class="restore" data-restore="'+t.id+'">Restore</button>'+
          '<button type="button" class="purge" data-purge="'+t.id+'">Delete permanently</button>'
        )+'</div></div>';
    }).join('')+'</div>' : '';

  document.getElementById('foot').textContent=
    'Built from pasted trip recaps. Hotel and ground times are as scheduled. '+
    'Recap pay may not reflect actual earnings; check Pay Summary for accuracy. '+
    'Bold times are local to each airport (report and release in Memphis time); the line below is GMT (Z).';
}

document.getElementById('all').addEventListener('click',function(){
  var ds=document.querySelectorAll('#list details');
  var anyClosed=Array.prototype.some.call(ds,function(d){return !d.open;});
  ds.forEach(function(d){d.open=anyClosed;});
  this.textContent=anyClosed?'Collapse all':'Expand all';
});

document.getElementById('list').addEventListener('click',function(ev){
  var rmBtn=ev.target.closest('[data-rm]');
  var confirmBtn=ev.target.closest('[data-confirm-rm]');
  var cancelBtn=ev.target.closest('[data-cancel-rm]');
  var crewEdit=ev.target.closest('[data-crew-edit]');
  var crewSave=ev.target.closest('[data-crew-save]');
  var crewCancel=ev.target.closest('[data-crew-cancel]');
  var crewAdd=ev.target.closest('[data-crew-add]');
  if(confirmBtn){
    ev.preventDefault();
    clearTimeout(pendingTimer);
    var id=confirmBtn.dataset.confirmRm;
    pendingRemoveId=null;
    change(function(d,now){ Trips.removeTrip(d,id,now); });
    return;
  }
  if(cancelBtn){
    ev.preventDefault();
    clearTimeout(pendingTimer);
    pendingRemoveId=null;
    render();
    return;
  }
  if(crewEdit){
    ev.preventDefault();
    var ds=crewEdit.dataset;
    editingCrew={tripId:ds.crewEdit, idx:+ds.crewIdx, name:ds.crewName||'', id:ds.crewId||'', phone:ds.crewPhone||''};
    render();
    return;
  }
  if(crewCancel){
    ev.preventDefault();
    editingCrew=null;
    render();
    return;
  }
  if(crewSave){
    ev.preventDefault();
    var ec=editingCrew;
    editingCrew=null;
    if(ec) change(function(d,now){ Trips.editCrew(d,ec.tripId,ec.idx,{name:ec.name.trim(),id:ec.id.trim(),phone:ec.phone.trim()},now); });
    return;
  }
  if(crewAdd){
    ev.preventDefault();
    var atid=crewAdd.dataset.crewAdd, dr=addDraft[atid]||{};
    delete addDraft[atid];
    change(function(d,now){ Trips.addCrew(d,atid,dr,now); });
    return;
  }
  if(rmBtn){
    ev.preventDefault();
    pendingRemoveId=rmBtn.dataset.rm;
    render();
  }
});
document.getElementById('list').addEventListener('input',function(ev){
  var cl=ev.target.classList, add=ev.target.closest('.crew-add');
  if(add){
    var dr=addDraft[add.dataset.trip]=addDraft[add.dataset.trip]||{};
    if(cl.contains('add-seat')) dr.seat=ev.target.value;
    else if(cl.contains('add-name')) dr.name=ev.target.value;
    else if(cl.contains('add-id')) dr.id=ev.target.value;
    else if(cl.contains('add-phone')) dr.phone=ev.target.value;
    return;
  }
  if(!editingCrew) return;
  if(cl.contains('crew-name-input')) editingCrew.name=ev.target.value;
  else if(cl.contains('crew-id-input')) editingCrew.id=ev.target.value;
  else if(cl.contains('crew-phone-input')) editingCrew.phone=ev.target.value;
});

document.getElementById('hidden-sec').addEventListener('click',function(ev){
  var restoreBtn=ev.target.closest('[data-restore]');
  var purgeBtn=ev.target.closest('[data-purge]');
  var confirmPurgeBtn=ev.target.closest('[data-confirm-purge]');
  var cancelPurgeBtn=ev.target.closest('[data-cancel-purge]');
  if(restoreBtn){
    var id=restoreBtn.dataset.restore;
    change(function(d,now){ Trips.restoreTrip(d,id,now); });
    return;
  }
  if(purgeBtn){
    pendingPurgeId=purgeBtn.dataset.purge;
    render();
    return;
  }
  if(cancelPurgeBtn){
    pendingPurgeId=null;
    render();
    return;
  }
  if(confirmPurgeBtn){
    var pid=confirmPurgeBtn.dataset.confirmPurge;
    pendingPurgeId=null;
    change(function(d,now){ Trips.purgeTrip(d,pid,now); });
  }
});



function pasteErrorMessage(e){
  var map={
    no_trip_line:'Couldn\'t find the trip header line (should look like "Trip 232 MEM 77 28SEP26"). Make sure you copied from the top of the page.',
    no_block_pay:'Couldn\'t find the Block/Pay totals line near the top of the trip.',
    no_table:'Couldn\'t find the flight details table — make sure the whole page was selected, not just part of it.',
    no_flights:'Didn\'t find any flight legs in this trip — nothing to add.'
  };
  return (e&&map[e.code])||'Couldn\'t make sense of that paste. Try copying the whole page again from the top.';
}

var PASTE_FORM=
'<div class="paste-form"><p>On the trip recap page, select all the text (Ctrl/Cmd+A) and copy it, then paste the whole thing below.</p>'+
'<textarea id="ptText" placeholder="Paste the full trip recap text here..."></textarea>'+
'<div class="paste-err" id="ptErr"></div>'+
'<div class="paste-actions"><button type="button" class="paste-cancel" id="ptCancel">Cancel</button>'+
'<button type="button" class="paste-save" id="ptParse">Parse trip</button></div></div>';

function openPasteForm(){
  document.getElementById('pasteForm').innerHTML=PASTE_FORM;
  document.getElementById('pasteBtn').textContent='Cancel pasting a trip';
}
function closePasteForm(){
  document.getElementById('pasteForm').innerHTML='';
  document.getElementById('pasteBtn').textContent='+ Paste a trip recap';
}
document.getElementById('pasteBtn').addEventListener('click',function(){
  if(document.getElementById('pasteForm').innerHTML.trim()) closePasteForm();
  else openPasteForm();
});
document.getElementById('pasteForm').addEventListener('click',function(ev){
  if(ev.target.closest('#ptCancel')){ closePasteForm(); return; }
  if(ev.target.closest('#ptParse')){
    var errEl=document.getElementById('ptErr');
    errEl.textContent='';
    var raw=document.getElementById('ptText').value;
    if(!raw||!raw.trim()){ errEl.textContent='Paste the trip text first.'; return; }
    var trip;
    try{ trip=parseTripPaste(raw); }
    catch(e){ errEl.textContent=pasteErrorMessage(e); return; }
    if(Trips.hasTrip(doc,trip.id)){ errEl.textContent='Trip '+trip.id+' is already on the list.'; return; }
    var cardHtml;
    try{ cardHtml=tripHTML(trip,true,true); }
    catch(e){ errEl.textContent='Parsed the trip, but couldn\'t display it — check the station codes look right.'; return; }
    closePasteForm();
    var wrap=document.createElement('div');
    wrap.className='preview';
    wrap.innerHTML='<div class="preview-head">Review before adding</div>'+cardHtml+
      '<div class="preview-actions">'+
        '<button type="button" class="preview-discard" data-discard="1">Discard</button>'+
        '<button type="button" class="preview-add" data-add="1">Add this trip</button>'+
      '</div>';
    wrap.addEventListener('click',function(ev2){
      if(ev2.target.closest('[data-add]')){ wrap.remove(); change(function(d,now){ Trips.addTrip(d,trip,now); }); }
      else if(ev2.target.closest('[data-discard]')){ wrap.remove(); }
    });
    document.getElementById('pastePreview').appendChild(wrap);
  }
});

render();
sync();
})();
</script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<title>Matt's trips importer</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 420px; margin: 32px auto; padding: 0 16px; }
  input, button { font: inherit; padding: 8px; width: 100%; box-sizing: border-box; margin: 6px 0; }
  #msg { min-height: 1.5em; }
</style>
<h1>Matt's trips importer</h1>
<p>Type the same password that you use in Matt's trips. The extension keeps a key made from it, not the password.</p>
<form id="f">
  <input id="pw" type="password" autocomplete="off" placeholder="Matt's trips password" required>
  <button>Save</button>
</form>
<p id="msg"></p>
<script src="options.js"></script>
